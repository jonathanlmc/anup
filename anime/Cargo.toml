[package]
name = "anime"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
anyhow = "1.0.103"
walkdir = "2.5"

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
serde_with = "3.22"
tap = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", optional = true, features = ["sync"] }
tracing = "0.1"

[features]
rate_limit = ["dep:tokio"]
