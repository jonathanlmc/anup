[package]
name = "anup"
version = "0.1.0"
edition = "2024"

[dependencies]
anime = { version = "0.1.0", path = "../anime" }
anime_detect = { version = "0.1.0", path = "../anime_detect", features = ["anime_integration"] }
anyhow = "1.0.100"
reqwest = "0.13.1"
strsim = "0.11.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
