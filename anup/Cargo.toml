[package]
name = "anup"
version = "0.1.0"
edition = "2024"

[dependencies]
anime = { version = "0.1.0", path = "../anime", features = ["rate_limit"] }
anime_detect = { version = "0.1.0", path = "../anime_detect", features = ["anime_integration"] }
anyhow = "1.0.102"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "from"] }
futures = "0.3.32"
indexmap = "2.14.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "std", "layout-cache", "macros"] }
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
strsim = "0.11.1"
tap = "1.0.1"
tokio = { version = "1.52.1", features = ["rt", "macros", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
