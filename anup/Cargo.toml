[package]
name = "anup"
version = "0.1.0"
edition = "2024"

[dependencies]
anime = { version = "0.1.0", path = "../anime", features = ["rate_limit"] }
anime_detect = { version = "0.1.0", path = "../anime_detect", features = ["anime_integration"] }
anyhow = "1.0.100"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["constructor"] }
futures = "0.3.31"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "std", "layout-cache", "macros"] }
reqwest = "0.13.1"
strsim = "0.11.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
