[package]
name = "anup"
version = "0.1.0"
edition = "2024"

[dependencies]
anime = { version = "0.1.0", path = "../anime", features = ["rate_limit"] }
ansi-to-tui = { version = "8.0.1", features = ["zero-copy"] }
anyhow = "1.0.104"
bytes = "1.12.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "from"] }
dirs = "6.0.0"
futures = "0.3.33"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg"] }
indexmap = "2.14.0"
infer = "0.22.0"
lru = "0.18.2"
medinpar = { git = "https://github.com/jonathanlmc/medinpar.git", rev = "cfd4fc97cc4ef54f4d1aa44c9e304fdc394dbd36" }
parking_lot = "0.12.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache", "macros"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "chafa-dyn", "tokio"] }
ratatui-widgets = { version = "0.3.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "stream", "system-proxy"] }
strsim = "0.11.1"
tap = "1.0.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
